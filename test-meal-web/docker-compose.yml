services:
  test-meal-web:
    container_name: test-meal-web
    build: .
    restart: always
    environment:
      MEAL_API_PUBLIC_BASE_URL: ${MEAL_API_PUBLIC_BASE_URL:-/meal-api}
      MEAL_API_UPSTREAM: ${MEAL_API_UPSTREAM:-host.docker.internal:5600}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-https://auth.quanect.kr/realms/Sandori}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-mymoo-test-web}
      KEYCLOAK_DISCOVERY_URL: ${KEYCLOAK_DISCOVERY_URL:-https://auth.quanect.kr/realms/Sandori/.well-known/openid-configuration}
      AUTH_DEV_HEADER_FALLBACK_ENABLED: ${AUTH_DEV_HEADER_FALLBACK_ENABLED:-false}
    ports:
      - "${TEST_MEAL_WEB_PORT:-5601}:80"
