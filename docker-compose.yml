services:
  mymoo-meal-service:
    container_name: mymoo-meal-service
    build: .
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      MEAL_TYPES_FILE_NAME: ${MEAL_TYPES_FILE_NAME:-meal_types.json}
      AUTH_DEV_HEADER_FALLBACK_ENABLED: ${AUTH_DEV_HEADER_FALLBACK_ENABLED:-false}
    volumes:
      - ./app/config/meal_types.json:/app/app/config/meal_types.json:ro
      - image_data:/app/data/images
    ports:
      - "5600:80"
    networks:
      - mymoo-network
    depends_on:
      - mymoo-meal-service-db

  test-meal-web:
    container_name: test-meal-web
    build:
      context: ./test-meal-web
    restart: always
    environment:
      MEAL_API_PUBLIC_BASE_URL: ${TEST_MEAL_WEB_API_BASE_URL:-https://mymoo.quanect.kr/meal}
      MEAL_API_UPSTREAM: ${TEST_MEAL_WEB_API_UPSTREAM:-mymoo-meal-service:80}
      KEYCLOAK_ISSUER: ${TEST_MEAL_WEB_KEYCLOAK_ISSUER:-https://auth.quanect.kr/realms/Mymoo}
      KEYCLOAK_CLIENT_ID: ${TEST_MEAL_WEB_KEYCLOAK_CLIENT_ID:-mymoo-test-web}
      KEYCLOAK_DISCOVERY_URL: ${TEST_MEAL_WEB_KEYCLOAK_DISCOVERY_URL:-https://auth.quanect.kr/realms/Mymoo/.well-known/openid-configuration}
      AUTH_DEV_HEADER_FALLBACK_ENABLED: ${AUTH_DEV_HEADER_FALLBACK_ENABLED:-false}
    ports:
      - "5601:80"
    networks:
      - mymoo-network
    depends_on:
      - mymoo-meal-service

  mymoo-meal-service-db:
    container_name: mymoo-meal-service-db
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    env_file:
      - path: .env
        required: false
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - mymoo-network

networks:
  mymoo-network:
    driver: bridge

volumes:
  db_data:
  image_data:
