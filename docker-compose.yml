services:
  mymoo-meal-service:
    container_name: mymoo-meal-service
    build: .
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      MEAL_TYPES_FILE_NAME: ${MEAL_TYPES_FILE_NAME:-meal_types.json}
      AUTH_DEV_HEADER_FALLBACK_ENABLED: ${AUTH_DEV_HEADER_FALLBACK_ENABLED:-false}
    volumes:
      - ./app/config/meal_types.json:/app/app/config/meal_types.json:ro
      - image_data:/app/data/images
    ports:
      - "5600:80"
    networks:
      - mymoo-network
    depends_on:
      - mymoo-meal-service-db

  test-meal-web:
    container_name: test-meal-web
    build:
      context: ./test-meal-web
    restart: always
    environment:
      MEAL_API_PUBLIC_BASE_URL: ${TEST_MEAL_WEB_API_BASE_URL:-https://mymoo.quanect.kr/meal}
      MEAL_API_UPSTREAM: ${TEST_MEAL_WEB_API_UPSTREAM:-mymoo-meal-service:80}
      KEYCLOAK_ISSUER: ${TEST_MEAL_WEB_KEYCLOAK_ISSUER:-https://auth.quanect.kr/realms/Mymoo}
      KEYCLOAK_CLIENT_ID: ${TEST_MEAL_WEB_KEYCLOAK_CLIENT_ID:-mymoo-test-web}
      KEYCLOAK_DISCOVERY_URL: ${TEST_MEAL_WEB_KEYCLOAK_DISCOVERY_URL:-https://auth.quanect.kr/realms/Mymoo/.well-known/openid-configuration}
      AUTH_DEV_HEADER_FALLBACK_ENABLED: ${AUTH_DEV_HEADER_FALLBACK_ENABLED:-false}
    ports:
      - "5601:80"
    networks:
      - mymoo-network
    depends_on:
      - mymoo-meal-service

  mymoo-meal-service-db:
    container_name: mymoo-meal-service-db
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    env_file:
      - path: .env
        required: false
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - mymoo-network

  siksabu-company-db:
    container_name: siksabu-company-db
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: siksabu_company
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - siksabu_company_db_data:/var/lib/postgresql/data
    networks:
      - mymoo-network

  siksabu-company-api:
    container_name: siksabu-company-api
    build: ../siksabu_company/backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@siksabu-company-db:5432/siksabu_company
      ENV: local
      AUTH_DEV_HEADER_FALLBACK_ENABLED: "true"
      CORS_ALLOW_ORIGINS: http://localhost:5602,http://127.0.0.1:5602,http://localhost:5173,http://127.0.0.1:5173
      KC_SERVER_URL: ${SIKSABU_KC_SERVER_URL:-https://auth.quanect.kr/}
      KC_REALM: ${SIKSABU_KC_REALM:-Mymoo}
      KC_CLIENT_ID: ${SIKSABU_KC_CLIENT_ID:-siksabu-admin-console}
      MEAL_SERVICE_BASE_URL: http://mymoo-meal-service:80
      MEAL_SERVICE_AUTH_MODE: dev_header
      MEAL_SERVICE_DEV_USER_ID: ${MEAL_SERVICE_DEV_USER_ID:-local-admin-sub}
    ports:
      - "5700:5700"
    networks:
      - mymoo-network
    depends_on:
      - siksabu-company-db

  siksabu-company-web:
    container_name: siksabu-company-web
    build: ../siksabu_company/frontend
    restart: always
    environment:
      CONSOLE_API_PUBLIC_BASE_URL: ${SIKSABU_WEB_API_BASE_URL:-/api}
      CONSOLE_API_UPSTREAM: ${SIKSABU_WEB_API_UPSTREAM:-siksabu-company-api:5700}
      KEYCLOAK_ISSUER: ${SIKSABU_WEB_KEYCLOAK_ISSUER:-https://auth.quanect.kr/realms/Mymoo}
      KEYCLOAK_CLIENT_ID: ${SIKSABU_WEB_KEYCLOAK_CLIENT_ID:-siksabu-admin-console}
      DEV_COMPANY_ID: ${SIKSABU_WEB_DEV_COMPANY_ID:-}
      AUTH_DEV_HEADER_FALLBACK_ENABLED: "true"
    ports:
      - "5602:80"
    networks:
      - mymoo-network
    depends_on:
      - siksabu-company-api

networks:
  mymoo-network:
    driver: bridge

volumes:
  db_data:
  image_data:
  siksabu_company_db_data:
