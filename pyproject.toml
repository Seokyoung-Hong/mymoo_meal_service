[project]
name = "mymoo-meal-service"
version = "0.1.0"
description = ""
authors = [{ name = "Seokyoung_Hong", email = "tjrdud0330@naver.com" }]
requires-python = ">=3.11,<3.12"
readme = "README.md"
dependencies = [
    "fastapi~=0.115.6",
    "uvicorn>=0.33",
    "SQLAlchemy>=2.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "httpx>=0.28",
    "fastapi-pagination>=0.12.34",
    "python-dotenv>=1.0.1",
    "alembic>=1.15.1",
    "cachetools>=5.5.2",
    "apscheduler>=3.11.0",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.21.0",
    "psycopg2-binary>=2.9.10",
    "python-keycloak>=7.0.2",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "black>=25.1.0",
    "mypy>=1.15.0",
    "types-cachetools>=5.5.0.20240820",
    "types-pytz>=2025.1.0.20250204",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "coverage>=7.14.3",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "docs",
    "alembic"
]

line-length = 88
indent-width = 4

target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "C", "D", "R", "B", "N", "S", "PL"]
ignore = ["E203", "E501", "D415", "D403"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_|__)$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D100", "D103", "S101", "PLR2004"]
"app/routers/meals.py" = ["B008", "D417", "PLR0913"]
"app/schemas/users.py" = ["D100", "D101"]
"app/services/__init__.py" = ["D104"]
"app/services/user_service.py" = ["D212", "F401"]
"app/utils/db.py" = ["D417", "F401"]
"app/utils/http.py" = ["D102", "D107"]
"app/utils/restaurants.py" = ["D417"]

